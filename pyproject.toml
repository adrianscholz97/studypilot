[project]
name = "studypilot"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Adrian Scholz", email = "adrian.scholz.1997@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "icalendar>=7.3.0",
    "langchain>=1.4.2",
    "langchain-anthropic>=1.7.4",
    "langchain-ollama>=1.1.0",
    "langchain-openai>=1.6.6",
    "langgraph>=1.2.12",
    "pydantic-settings>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
studypilot = "studypilot:main"

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
